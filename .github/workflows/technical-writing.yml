name: Technical writing skill checks
on:
  pull_request:
    paths:
      - 'skills/in-progress/technical-writing/**'
      - 'skills/in-progress/technical-revision/**'
      - 'reviews/in-progress/technical-writing/**'
      - '.github/workflows/technical-writing.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Check standalone packages and shared references
        run: python reviews/in-progress/technical-writing/check.py
